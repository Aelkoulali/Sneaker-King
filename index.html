<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Sneaker King</title>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/e4b53298eb.js" crossorigin="anonymous"></script>

  <!-- Bootstrap CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="home-page">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light navbar-home">
    <a class="navbar-brand" href="index.html">
      <img src="Public/Logo/logo.png" alt="logo" />
    </a>
    <button class="navbar-toggler navbar-dark" type="button" data-toggle="collapse" data-target="#main-navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="main-navigation">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="account.html">My Account</a></li>
        <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero Section -->
    <section class="hero" id="home">
      <div class="container-fluid">
        <div class="row align-items-center justify-content-center">
          <div class="col-lg-6 mb-5 mb-lg-0">
            <img src="Public/Hero/hero.jpg"
              style="clip-path: polygon(25% 0%, 100% 0%, 100% 99%, 0% 100%);"
              class="img-fluid"
              alt="Air Jordan 1"
              loading="lazy"
            />
          </div>
          <div class="col-lg-6 col-xl-5 text-center text-md-start">
            <h1 class="fw-normal">Elevate your style with Sneaker King</h1>
            <div class="mt-4 mb-5">
              <a class="btn btn-warning px-4 btn-lg" href="shop.html"><strong>SHOP NOW</strong></a>
            </div>
            <div class="row">
              <div class="col-3"><img class="img-fluid" src="Public/Brands/Adidas.jpg" alt="Adidas logo" /></div>
              <div class="col-3"><img class="img-fluid" src="Public/Brands/Jordan.png" alt="Jordan logo" /></div>
              <div class="col-3"><img class="img-fluid" src="Public/Brands/Nike.png" alt="Nike logo" /></div>
              <div class="col-3"><img class="img-fluid" src="Public/Brands/NB.png" alt="New Balance logo" /></div>
            </div>
            <div class="social_icons mt-4" style="font-size: 35px;">
              <a class="Social" href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin"></i></a>
              <a class="Social" href="https://www.instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
              <a class="Social" href="https://www.tiktok.com/" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
              <a class="Social" href="https://www.twitch.tv/" target="_blank"><i class="fa-brands fa-twitch"></i></a>
              <a class="Social" href="https://www.twitter.com/" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
              <a class="Social" href="https://youtube.com/" target="_blank"><i class="fa-brands fa-youtube"></i></a>
            </div>
          </div>
        </div>
      </div>
    </section>
  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>
  <script src="script.js"></script>
